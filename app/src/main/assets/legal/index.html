<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frosty Roll Rally</title>
  <meta name="description" content="Frosty Roll Rally: roll a giant snowball, build ice bridges and race rivals across 5,000 snowy 3D levels. Play offline!" />

  <style>
    :root{
      --bg:#fff;
      --muted:#666;
      --max:920px
    }

    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      margin:0;
      background:linear-gradient(180deg,#fff 0%,#fbfbff 100%);
      color:#111
    }

    header{
      padding:28px 18px;
      border-bottom:1px solid #eee;
      text-align:center;
    }

    .container{
      max-width:var(--max);
      margin:28px auto;
      padding:0 18px;
      text-align:center;
    }

    h1{font-size:22px;margin:0 0 8px}
    p.lead{color:var(--muted);margin:0 0 18px}

    /* Banner */
    .banner img{
      width:100%;
      max-width:600px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      margin-top:10px;
    }

    /* Buttons row */
    .btn-group{
      margin-top:30px;
      display:flex;
      justify-content:center;
      gap:16px;
      flex-wrap:wrap;
    }

    /* iOS style buttons */
    .store-btn{
      flex:1;
      min-width:160px;
      max-width:260px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      padding:16px 20px;
      font-size:18px;
      font-weight:600;
      color:#111;
      text-decoration:none;

      border-radius:22px;
      background:linear-gradient(180deg,#f7f7f7,#eaeaea);
      border:1px solid #e3e3e3;

      box-shadow:
        0 6px 20px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.9);

      transition:0.2s;
    }

    .store-btn:hover{
      transform:translateY(-2px);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    .store-btn:active{
      transform:scale(0.97);
    }

    /* Legal links */
    .legal{
      margin:34px 0 8px;
      font-size:14px;
      color:var(--muted);
    }

    .legal a{
      color:var(--muted);
    }

    @media (max-width:520px){
      h1{font-size:18px}
      .store-btn{
        font-size:16px;
        padding:14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Frosty Roll Rally</h1>
    <p class="lead">Effective Date: <strong>19 November 2026</strong></p>
  </header>

  <main class="container">

    <!-- Banner -->
    <div class="banner">
      <img src="app_logo.webp" alt="Frosty Roll Rally">
    </div>

    <!-- Buttons -->
    <div class="btn-group">

      <a href="https://play.google.com/store/apps/details?id=com.ngstudio.frostyroll"
         target="_blank"
         class="store-btn">
        🤖 Android
      </a>

    </div>

    <!-- Legal pages -->
    <p class="legal">
      <a href="privacy_policy.html">Privacy Policy</a> &middot;
      <a href="terms_conditions.html">Terms &amp; Conditions</a>
    </p>

  </main>

  <!-- Hidden app-ads.txt link (no UI, same as the other NG Studio app pages) -->
  <a href="app-ads.txt" style="display:none;"></a>

</body>
</html>
